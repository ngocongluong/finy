plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.finyvoice'
version = '0.1.0'

android {
  namespace "expo.modules.finyvoice"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
    // Applied to the app's release build (R8).
    consumerProguardFiles 'proguard-rules.pro'
  }
}

dependencies {
  implementation 'androidx.core:core-ktx:1.13.1'
  // sherpa-onnx (Apache-2.0): keyword spotting and speaker embeddings, on the phone.
  // Downloaded with its native libraries and models by scripts/fetch-ears.sh.
  implementation files('libs/sherpa-onnx-2.0.1-classes.jar')
}
